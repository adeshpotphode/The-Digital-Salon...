<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/1stbean/inquirieslist.css">
    <title>The Glamour Salon - Website</title>
</head>
<body>
<div class="header">
  <nav>
    <!-- Logo -->
    <div class="logo">
      <a href="/"><img src="/img/logo.png" alt="image not found"></a>
      <h2>The Glamour Salon <span><br> hair & Beauty</span></h2>
    </div>

    <!-- Hamburger Button -->
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Nav Links -->
    <ul id="nav-links">
      <li><a href="Services">SERVICES</a></li>
      <li><a href="Academy">ACADEMY</a></li>
      <li><a href="Franchise">FRANCHISE</a></li>
    </ul>

    <!-- Buttons -->
    <div class="actions">
      <a href="Appointment" class="shop">Contact US - Booking Seat</a>
      <a href="Shop" class="shop">Salon Product - Shop Now</a>
    </div>
  </nav>
</div>


<script>
  const hamburger = document.getElementById("hamburger");
  const navLinks = document.getElementById("nav-links");
  const actions = document.querySelector(".actions");

  hamburger.addEventListener("click", () => {
    hamburger.classList.toggle("active");
    navLinks.classList.toggle("active");
    actions.classList.toggle("active");
  });
</script>

<div class="adminButton">
    <a href="AdminPage"><button class="for-admin">Go to Admin page</button></a>
</div>


<div class="headerTable">
    <h3 class="headingTable">All Academy Inquiries List</h3>
    <table class="table">
        <thead>
            <tr>
                <th>firstName</th>
                <th>lastName</th>
                <th>contacts</th>
                <th>email</th>
                <th>city</th>
                <th>Address</th>
                <th>inquiry</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="inquiries:${allInquiriesList}">
                <td th:text="${inquiries.firstName}"></td>
                <td th:text="${inquiries.lastName}"></td>
                <td th:text="${inquiries.contacts}"></td>
                <td th:text="${inquiries.email}"></td>
                <td th:text="${inquiries.city}"></td>
                <td th:text="${inquiries.Address}"></td>
                <td th:text="${inquiries.massage}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
